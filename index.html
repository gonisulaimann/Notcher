<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notcher has moved</title>
<meta http-equiv="refresh" content="2; url=https://notcherapp.github.io/">
<link rel="canonical" href="https://notcherapp.github.io/">
<style>
  body {
    background: #0a0a0c; color: #f2f2f4;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex; min-height: 100vh;
    align-items: center; justify-content: center;
    text-align: center; margin: 0; padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 20px;
    padding: 48px 56px;
    max-width: 440px;
  }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 12px; }
  h1 span { color: #ff9f0a; }
  p { color: rgba(255,255,255,0.62); font-size: 15px; }
  a { color: #fff; }
</style>
</head>
<body>
  <div class="card">
    <h1>Notcher has <span>moved.</span></h1>
    <p>Taking you to <a href="https://notcherapp.github.io/">notcherapp.github.io</a>…</p>
  </div>
  <script>setTimeout(function(){ location.replace("https://notcherapp.github.io/"); }, 100);</script>
</body>
</html>
